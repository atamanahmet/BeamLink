spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

nexus.name=test-nexus
nexus.admin.username=admin
nexus.admin.password=admin
nexus.cors.static-origins=http://localhost:5174
nexus.jwt.admin-expiration-minutes=60
nexus.jwt.agent-auth-expiration-days=30
nexus.jwt.agent-public-expiration-days=30
nexus.jwt.secret=test-secret-key-for-tests-only
NEXUS_JWT_SECRET=test-secret-key-for-tests-only
