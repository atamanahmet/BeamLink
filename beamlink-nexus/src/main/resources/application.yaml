server:
  port: ${NEXUS_PORT:7472}
  address: 127.0.0.1
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1

spring:
  application:
    name: beamlink-nexus
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  config:
    import: optional:file:../config/.env[.properties]
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: "jdbc:sqlite:${beamlink.runtime.dir}/data/database/nexus.db?journal_mode=WAL&busy_timeout=3000&foreign_keys=on"
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

nexus:
  tls:
    port: ${NEXUS_TLS_PORT:7473}
  data:
    directory: ${beamlink.runtime.dir}
  update:
    storage-path: ${beamlink.runtime.dir}/data/update-package
  upload:
    directory: ${beamlink.runtime.dir}/data/uploads
  approval:
    required: true
  name: ${NEXUS_NAME}
  ip: ${NEXUS_IP:auto}
  monitoring:
    interval: 60000
  transfer:
    expiry-hours: ${TRANSFER_EXPIRY_HOURS:24}
  jwt:
    admin-expiration-minutes: ${NEXUS_JWT_ADMIN_EXPIRATION_MINUTES}
    device-auth-expiration-days: ${NEXUS_JWT_AGENT_AUTH_EXPIRATION_DAYS}
    device-public-expiration-days: ${NEXUS_JWT_AGENT_PUBLIC_EXPIRATION_DAYS}
  cors:
    static-origins: ${NEXUS_CORS_STATIC_ORIGINS}
  admin:
    username: ${NEXUS_ADMIN_USERNAME:}
    password: ${NEXUS_ADMIN_PASSWORD:}

beamlink:
  transfer:
    chunk-size-bytes: 524288

logging:
  level:
    org.flywaydb: DEBUG
    root: INFO
    com.atamanahmet.beamlink: INFO
  file:
    name: ${beamlink.runtime.dir}/logs/nexus.log
  pattern:
    level: "%5p [%X{correlationId:-}]"
    console: "%d{HH:mm:ss.SSS} [%thread] ${LOG_LEVEL_PATTERN:%5p} %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health