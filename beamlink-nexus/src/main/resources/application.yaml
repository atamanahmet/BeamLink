server:
  port: ${NEXUS_PORT:7472}
  address: 0.0.0.0

spring:
  application:
    name: beamlink-nexus
  config:
    import: optional:file:../config/.env[.properties]
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: "jdbc:sqlite:${beamlink.runtime.dir}/data/database/nexus.db?journal_mode=WAL&busy_timeout=3000&foreign_keys=on"
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

nexus:
  data:
    directory: ${beamlink.runtime.dir}
  update:
    storage-path: ${beamlink.runtime.dir}/data/update-package
  upload:
    directory: ${beamlink.runtime.dir}/data/uploads
    temp-directory: ${beamlink.runtime.dir}/data/temp
  approval:
    required: true
  name: ${NEXUS_NAME}
  ip: ${NEXUS_IP:auto}
  monitoring:
    interval: 60000
  transfer:
    expiry-hours: ${TRANSFER_EXPIRY_HOURS:24}
  jwt:
    admin-expiration-minutes: ${NEXUS_JWT_ADMIN_EXPIRATION_MINUTES}
    agent-auth-expiration-days: ${NEXUS_JWT_AGENT_AUTH_EXPIRATION_DAYS}
    agent-public-expiration-days: ${NEXUS_JWT_AGENT_PUBLIC_EXPIRATION_DAYS}
  cors:
    static-origins: ${NEXUS_CORS_STATIC_ORIGINS}
  admin:
    username: ${NEXUS_ADMIN_USERNAME}
    password: ${NEXUS_ADMIN_PASSWORD}

logging:
  level:
    org.flywaydb: DEBUG
    root: INFO
    com.atamanahmet.beamlink: INFO
  file:
    name: ${beamlink.runtime.dir}/logs/nexus.log
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health