server:
  port: ${PEER_PORT:9090}
  address: 127.0.0.1
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1

spring:
  application:
    name: beamlink-peer
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  config:
    import: optional:file:../config/.env[.properties]
  datasource:
    url: "jdbc:sqlite:${beamlink.runtime.dir}/data/database/peer.db?journal_mode=WAL&busy_timeout=3000&foreign_keys=on"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  web:
    resources:
      static-locations: file:./static/,classpath:/static/

peer:
  ip-address: ${PEER_IP:auto}
  name: ${PEER_NAME:beamlink-peer}
  tls:
    port: ${PEER_TLS_PORT:9091}
  data:
    directory: ${beamlink.runtime.dir}
  update:
    storage-path: ${beamlink.runtime.dir}/data/update-package
  upload:
    directory: ${beamlink.runtime.dir}/data/uploads
  transfer:
    expiry-hours: ${TRANSFER_EXPIRY_HOURS:24}
  heartbeat:
    interval: 30000
  auto-resume-transfer: false
  auto-resume-group-transfers: false

beamlink:
  transfer:
    chunk-size-bytes: 524288

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
    console: "%d{HH:mm:ss.SSS} [%thread] ${LOG_LEVEL_PATTERN:%5p} %logger{36} - %msg%n"
  file:
    name: ${beamlink.runtime.dir}/logs/peer.log
